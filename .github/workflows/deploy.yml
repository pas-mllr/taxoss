name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Azure resources — created once via scripts/azure-provision.sh.
  RESOURCE_GROUP: taxoss-rg
  ACR_NAME: taxossacr
  CONTAINERAPP: taxoss
  IMAGE_REPO: taxoss/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (ACR remote build)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPO:${{ github.sha }}" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://eu.i.posthog.com" \
            .

      # TODO: once the gh-stats-token ACA secret holds a real fine-grained PAT,
      # re-add "GITHUB_TOKEN=secretref:gh-stats-token" below — a placeholder
      # value would 401 every GitHub API call, unauthenticated at least works.
      # SEED_STARTERS=1 is idempotent: the starter seed exits early once any
      # project exists, so it only ever populates a brand-new database.
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINERAPP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ github.sha }}" \
            --set-env-vars \
              "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
              "NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in" \
              "NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up" \
              "SEED_STARTERS=1" \
              "LITESTREAM_BUCKET=taxoss-db" \
              "AZURE_STORAGE_ACCOUNT=taxossdb" \
              "AZURE_STORAGE_KEY=secretref:azure-storage-key" \
              "CLERK_SECRET_KEY=secretref:clerk-secret-key" \
              "ADMIN_USER_IDS=secretref:admin-user-ids" \
              "ADMIN_API_TOKEN=secretref:admin-api-token" \
              "BREVO_API_KEY=secretref:brevo-api-key" \
              "BREVO_LIST_ID=${{ secrets.BREVO_LIST_ID }}"
